name: Setup Rust Environment

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2

    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y libsqlite3-dev
